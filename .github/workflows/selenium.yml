name: Selenium

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '30 3 * * *' # nightly full suite, offset from the Playwright project
  workflow_dispatch:

concurrency:
  group: selenium-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The public site shows a Cloudflare check to data-center IPs, so CI tests a private copy.
      - name: Start a private Toolshop
        run: bash .github/scripts/start-toolshop.sh
      - name: Run tests
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
          DB_URL: jdbc:mariadb://127.0.0.1:3306/toolshop?user=user&password=root
          TIER: ${{ github.event_name == 'push' && '-Dgroups=sanity' || '' }}
        run: ./mvnw -B test $TIER -DexcludedGroups=visual
      - name: Show the private Toolshop logs after a failure
        if: ${{ failure() }}
        env:
          SPRINT: sprint5
        working-directory: toolshop
        run: |
          docker compose -f docker-compose.yml logs --tail=60 laravel-api web
          docker compose -f docker-compose.yml exec -T laravel-api sh -c 'tail -n 60 storage/logs/*.log' || true
      - name: Upload reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/screenshots
          retention-days: 14
