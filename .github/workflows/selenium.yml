name: Selenium

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '30 3 * * *' # nightly full suite, offset from the Playwright project
  workflow_dispatch:

concurrency:
  group: selenium-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        env:
          TIER: ${{ github.event_name == 'push' && '-Dgroups=sanity' || '' }}
        run: ./mvnw -B test $TIER -DexcludedGroups=visual
      - name: Upload reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/screenshots
          retention-days: 14
